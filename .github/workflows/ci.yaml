name: CI
on:
  pull_request:
    branches: ['main', 'release/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      # Each run saves the entries it restored plus its own, so without a limit the cache only grows.
      TURBO_CACHE_MAX_AGE: 7d
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup PNPM
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          cache: 'pnpm'
          node-version-file: '.nvmrc'
      - name: Generate Environment
        run: ./scripts/generate-env.sh
      - name: Configure Git
        run: |
          # necessary for the git commands used for release info
          git config --global --add safe.directory /__w/OpenDataCapture/OpenDataCapture
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      # A pull request reads the caches of its own earlier runs and the one the Release workflow last
      # saved on its base branch, so a run repeats only the turbo tasks whose inputs changed.
      - name: Restore Turbo Cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      # Run lint and unit tests before the (occasionally flaky) Playwright install so those results
      # aren't blocked by a hung browser download.
      - name: Lint
        run: pnpm lint
      - name: Unit Tests
        run: pnpm test:coverage
      - name: Install Playwright
        # Cap the step so a hang fails fast instead of hitting the 6h job limit, skip the interactive
        # apt prompt, and install only the browser the e2e suite uses.
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: pnpm --filter "@opendatacapture/testing" exec playwright install --with-deps chromium
      - name: End-to-End Tests
        run: pnpm test:e2e
