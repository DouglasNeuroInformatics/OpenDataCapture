name: Issues
on:
  issues:
    types:
      - reopened
      - opened
permissions:
  contents: read
  issues: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Run Script
        uses: actions/github-script@v9
        with:
          script: |
            require('./.github/scripts/issues.cjs')()
