name: Release
on:
  push:
    branches: ['main']
  # Release branches (release/<major>.<minor>) release on dispatch only; release.cjs refuses any other ref.
  workflow_dispatch:
permissions:
  contents: write
  packages: write
# One Release at a time across every ref: release.cjs plans from a tag snapshot, so a run on another
# ref must not overlap it (.agents/docs/architecture/release-channels.md).
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      edge: ${{ steps.plan.outputs.edge }}
      latest: ${{ steps.plan.outputs.latest }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      npm_tag: ${{ steps.plan.outputs.npmTag }}
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release.cjs reads every v* tag
      - name: Derive Build Matrix
        id: matrix
        run: |
          matrix=$(docker compose config --no-interpolate --format json \
            | jq -c '{include:[.services|to_entries[]|select(.value.build and .value.image)|{image:(.value.image|split(":")[0]),dockerfile:.value.build.dockerfile}]}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Plan Release
        id: plan
        uses: actions/github-script@v9
        with:
          script: |
            await require('./.github/scripts/release.cjs')({ context, core, github, exec, glob, io })
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: '.nvmrc'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate
        run: GATEWAY_DATABASE_URL=file:${TMPDIR}tmp.db pnpm lint
  build:
    runs-on: ubuntu-latest
    needs: [configure, validate]
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.configure.outputs.matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set Up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ needs.configure.outputs.edge }}
            type=sha,prefix=sha-,format=short,enable=${{ needs.configure.outputs.edge }}
            type=raw,value=${{ needs.configure.outputs.version }},enable=${{ needs.configure.outputs.release }}
            type=raw,value=${{ needs.configure.outputs.channel }},enable=${{ needs.configure.outputs.release }}
            type=raw,value=latest,enable=${{ needs.configure.outputs.latest }}
      - name: Build and Push Docker Images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: |
            RELEASE_VERSION=${{ needs.configure.outputs.version }}
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  publish-npm:
    runs-on: ubuntu-latest
    # Its deployment-branch policy (main and release/*) is what the npm trusted publisher is pinned to.
    environment: release
    permissions:
      contents: read
      id-token: write # mint an OIDC token for npm trusted publishing (no NPM_TOKEN needed)
    needs:
      - build
      - configure
    if: ${{ needs.configure.outputs.release == 'true' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Print Tool Versions
        run: |
          echo "pnpm: $(pnpm --version)"
          echo "npm:  $(npm --version)"
          echo "node: $(node --version)"
      - name: Build Publishable Packages
        run: |
          # Build each publishable package and its dependency closure (turbo skips
          # packages that have no build script, e.g. those that publish source directly).
          filters=()
          while IFS=$'\t' read -r name version pkgPath; do
            filters+=("--filter=${name}...")
          done < <(scripts/list-publishable.sh)
          pnpm exec turbo run build "${filters[@]}"
      - name: Publish Packages
        env:
          NPM_TAG: ${{ needs.configure.outputs.npm_tag }}
        run: |
          # Publish each marked package whose version is not already on npm. The version
          # check keeps this idempotent across workflow re-runs.
          while IFS=$'\t' read -r name version pkgPath; do
            if [ -n "$(npm view "${name}@${version}" version 2>/dev/null)" ]; then
              echo "Skipping ${name}@${version} (already published)"
              continue
            fi
            echo "Publishing ${name}@${version} under ${NPM_TAG}"
            pnpm --filter "${name}" publish --no-git-checks --tag "${NPM_TAG}"
          done < <(scripts/list-publishable.sh)
  release:
    runs-on: ubuntu-latest
    needs:
      - build
      - configure
      - publish-npm
    if: ${{ needs.configure.outputs.release == 'true' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: '.nvmrc'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Extract Release Notes
        # Fails when CHANGELOG.md has no section for this version: a bump that bypassed the generator
        # must not publish a release with an empty body.
        run: pnpm exec tsx scripts/changelog.ts section "${{ needs.configure.outputs.version }}" > "$RUNNER_TEMP/release-notes.md"
      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          make_latest: ${{ needs.configure.outputs.latest }}
          tag_name: v${{ needs.configure.outputs.version }}
          # The action otherwise creates a new tag on the default branch, not on the commit this run built.
          target_commitish: ${{ github.sha }}
