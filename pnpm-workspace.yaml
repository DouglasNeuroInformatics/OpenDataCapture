---
allowBuilds:
  '@import-meta-env/unplugin': true
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  esbuild: true
  mongodb-memory-server: true
  msgpackr-extract: false
  prisma: true
  sharp: true
blockExoticSubdeps: true
catalog:
  '@casl/ability': '^6.7.1'
  '@commitlint/cli': '^21.2.3'
  '@commitlint/config-conventional': '^21.2.3'
  '@douglasneuroinformatics/esbuild-plugin-prisma': 'latest'
  '@douglasneuroinformatics/libcrypto': '^0.0.6'
  '@douglasneuroinformatics/libjs': ^3.2.1
  '@douglasneuroinformatics/libpasswd': '^0.0.3'
  '@douglasneuroinformatics/libstats': '^0.2.1'
  '@douglasneuroinformatics/libui': ^6.16.1
  '@douglasneuroinformatics/libui-form-types': ^1.4.0
  '@microsoft/api-extractor': '^7.59.2'
  '@prisma/client': '^6.9.0'
  '@tailwindcss/vite': '4.3.3'
  '@testing-library/dom': '^10.4.2'
  '@testing-library/react': '^16.3.3'
  axios: ^1.20.0
  commander: '^15.0.0'
  esbuild: '0.28.x'
  esbuild-wasm: '0.28.x'
  happy-dom: '~20.11.15'
  msgpackr: ^2.1.0
  motion: '13.4.4'
  neverthrow: ^8.2.0
  nodemailer: ^10.0.11
  conventional-commits-parser: '^7.1.2'
  prisma: '^6.9.0'
  react-dropzone: ^20.1.2
  '@tailwindcss/postcss': '4.3.3'
  tailwindcss: '4.3.3'
  tsx: '4.23.15'
  serialize-error: '^13.0.1'
  vite: '^7.3.6'
  zustand: ^5.0.15
  '@storybook/addon-docs': '^10.6.1'
  '@storybook/addon-themes': '^10.6.1'
  '@storybook/react-vite': '^10.6.1'
  'storybook': '^10.6.1'
catalogs:
  react19:
    react: 19.1.0
    react-dom: 19.1.0
    react-is: 19.1.0
# storybook's published types import @storybook/react without depending on it. Hoisted, that import
# reaches a different peer variant than the stories use, TypeScript merges the two copies onto it,
# and every story's args become `any` (storybook/AGENTS.md).
hoistPattern:
  - '*'
  - '!@storybook/react'
minimumReleaseAge: 10080 # 7 days
minimumReleaseAgeExclude:
  - '@douglasneuroinformatics/*'
  - find-my-way
packages:
  - 'apps/*'
  - 'packages/*'
  - 'runtime/*'
  - 'storybook'
  - 'testing'
  - 'vendor/**/*'
